<!doctype html>
<html>
  <head>
<meta name="method21-offline" content="true">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'">

    <meta charset="utf-8"/>
    <title>FSS | WebGL Basic Example</title>
    <meta name="author" content="Matthew Wagerfield"/>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no"/>

    <style>
    body {
      background: #111118;
      margin: 0;
      overflow: hidden;
    }
    .container {
      position: absolute;
      height: 100vh;
      width: 100vw;
    }
    </style>

  </head>
  <body>

    <div id="container" class="container">
    </div>

    <script src="deploy/fss.js"></script>
    <script>

    var container = document.getElementById('container');
    var renderer = new FSS.WebGLRenderer();
    var scene = new FSS.Scene();
    var light = new FSS.Light('#111122', '#FF0022');
    var geometry = new FSS.Plane(container.offsetWidth, container.offsetHeight, 10, 8);
    var material = new FSS.Material('#FFFFFF', '#FFFFFF');
    var mesh = new FSS.Mesh(geometry, material);
    var now, start = Date.now();

    function initialise() {
      scene.add(mesh);
      scene.add(light);
      container.appendChild(renderer.element);
      window.addEventListener('resize', resize);
    }

    function resize() {
      renderer.setSize(container.offsetWidth, container.offsetHeight);
      // Optional: recreate geometry to fit perfectly, but scaling is usually fine for a basic demo
    }

    function animate() {
      now = Date.now() - start;
      light.setPosition(300*Math.sin(now*0.001), 200*Math.cos(now*0.0005), 60);
      renderer.render(scene);
      requestAnimationFrame(animate);
    }

    initialise();
    resize();
    animate();

    </script>

  <script src="_method_capsule_bridge.js"></script>
</body>
</html>
